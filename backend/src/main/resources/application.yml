spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ez-one-backend
  main:
    keep-alive: true
  profiles:
    active: mysql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ez_one}}
    username: ${DB_USERNAME:${DB_USER:ez_one}}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      schema-locations: classpath:schema-mysql.sql
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# 공공데이터포털 API 연동
public-data:
  api:
    key: ${PUBLIC_DATA_API_KEY:}

company-enrichment:
  realtime:
    enabled: ${COMPANY_ENRICHMENT_REALTIME_ENABLED:true}
  financial-company-basic-info:
    url: ${FINANCIAL_COMPANY_BASIC_INFO_URL:}
  public-institution:
    url: ${PUBLIC_INSTITUTION_API_URL:http://apis.data.go.kr/1051000/public_inst/list}
  large-enterprise-affiliate:
    url: ${FTC_AFFILIATE_API_URL:http://apis.data.go.kr/1130000/appnGroupAffiList/appnGroupAffiListApi}
    presentn-year: ${FTC_PRESENTN_YEAR:}
    max-pages: ${FTC_AFFILIATE_MAX_PAGES:50}
  middle-market:
    url: ${MIDDLE_MARKET_API_URL:}

company-data:
  startup-sync:
    enabled: ${COMPANY_DATA_STARTUP_SYNC_ENABLED:false}
  batch-sync:
    enabled: ${COMPANY_DATA_BATCH_SYNC_ENABLED:false}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml

opendart:
  api-key: ${OPENDART_API_KEY:}

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://[::1]:5173,chrome-extension://*}

mattermost:
  webhook:
    secret: ${MATTERMOST_WEBHOOK_SECRET:}
    secrets: ${MATTERMOST_WEBHOOK_SECRETS:}
  backfill:
    year: ${MATTERMOST_BACKFILL_YEAR:0}

notion:
  client-id: ${NOTION_CLIENT_ID:}
  client-secret: ${NOTION_CLIENT_SECRET:}
  authorization-uri: ${NOTION_AUTHORIZATION_URI:https://api.notion.com/v1/oauth/authorize}
  token-uri: ${NOTION_TOKEN_URI:https://api.notion.com/v1/oauth/token}
  pages-uri: ${NOTION_PAGES_URI:https://api.notion.com/v1/pages}
  databases-uri: ${NOTION_DATABASES_URI:https://api.notion.com/v1/databases}
  version: ${NOTION_VERSION:2022-06-28}
  token-encryption-key: ${NOTION_TOKEN_ENCRYPTION_KEY:}

gms:
  ai:
    api-key: ${GMS_API_KEY:}
    base-url: ${GMS_AI_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1}
    recommendation-model: ${GMS_RECOMMENDATION_MODEL:gpt-4.1-mini}

dart:
  ai:
    fast-model: ${DART_AI_FAST_MODEL:gpt-4.1-mini}
    analysis-model: ${DART_AI_ANALYSIS_MODEL:gpt-4.1}
    compare-model: ${DART_AI_COMPARE_MODEL:gemini-2.5-flash}

auth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    token-uri: ${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
    user-info-uri: ${GOOGLE_USER_INFO_URI:https://www.googleapis.com/oauth2/v3/userinfo}
  jwt:
    access-secret: ${JWT_ACCESS_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
