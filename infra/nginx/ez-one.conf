server {
    listen 80;
    listen [::]:80;
    server_name ez-one.o-r.kr;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ez-one.o-r.kr;

    ssl_certificate /etc/letsencrypt/live/ez-one.o-r.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ez-one.o-r.kr/privkey.pem;

    root /var/www/ez-one;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    access_log /var/log/nginx/ez-one.access.log;
    error_log /var/log/nginx/ez-one.error.log warn;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
